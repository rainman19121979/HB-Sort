name: Build & Test

# Bei jedem Push auf main + bei jedem PR gegen main:
# - Solution restoren
# - Release-Build
# - Tests laufen lassen
#
# Laeuft auf windows-latest weil das Projekt UseWPF=true hat (WPF +
# native Dependencies wie OpenCvSharp4 brauchen Windows).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Hinweis: HBSort.slnx ist das neue XML-Solution-Format (ab .NET 9 SDK).
      # Der GitHub-Runner mit dotnet 8.0.x kennt es nicht - daher bauen wir
      # gezielt die zwei csproj-Wurzeln. dotnet zieht ihre Dependencies
      # (HBSort.Core) automatisch transitiv mit.

      - name: Restore
        run: |
          dotnet restore HBSort/HBSort.csproj
          dotnet restore HBSort.Tests/HBSort.Tests.csproj

      - name: Build (Release)
        run: |
          dotnet build HBSort/HBSort.csproj -c Release --no-restore
          dotnet build HBSort.Tests/HBSort.Tests.csproj -c Release --no-restore

      - name: Test (Release)
        run: dotnet test HBSort.Tests/HBSort.Tests.csproj -c Release --no-build --verbosity normal
