name: Build & Test

# Bei jedem Push auf main + bei jedem PR gegen main:
# - Solution restoren
# - Release-Build
# - Tests laufen lassen
#
# Laeuft auf windows-latest weil das Projekt UseWPF=true hat (WPF +
# native Dependencies wie OpenCvSharp4 brauchen Windows).
#
# dotnet-Version: 9.0.x. Begruendung: HBSort.slnx ist das neue XML-
# Solution-Format, das erst ab .NET 9 SDK unterstuetzt wird. dotnet 8
# wuerde "no such file" auf der slnx melden. TargetFramework bleibt
# in den csproj-Files net8.0-windows; das dotnet 9 SDK kann net8.0-
# Projekte ohne Probleme bauen (SDK-Version und TargetFramework sind
# unabhaengig).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore HBSort.slnx

      - name: Build (Release)
        run: dotnet build HBSort.slnx -c Release --no-restore

      - name: Test (Release)
        run: dotnet test HBSort.slnx -c Release --no-build --verbosity normal
