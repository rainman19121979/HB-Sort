version: 2

# Wenn Dependabot neue Updates findet:
# - NuGet wird woechentlich gecheckt (Microsoft- und Community-Pakete
#   bekommen oft Patches; bei .NET 8 wollen wir die mitkriegen).
# - GitHub-Actions werden monatlich gecheckt (langsamer Update-Zyklus).
#
# Dependabot eroeffnet pro Update einen Pull Request gegen main.
# Der CI-Workflow (build.yml) laeuft dann automatisch + verifiziert
# dass der Build mit dem Update sauber bleibt.

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major-Bumps blockieren fuer:
    # - Markdig: Markdig.Wpf 0.5.0.1 ist gegen Markdig 0.x gebaut und hat
    #   keine 1.x-kompatible Version.
    # - Microsoft.Data.Sqlite + EntityFrameworkCore.Sqlite +
    #   EntityFrameworkCore.Design: muessen alle drei dieselbe Hauptversion
    #   haben, ein einzelner Bump waere ein Versions-Konflikt + Laufzeit-
    #   Inkompatibilitaet. EF Core 8 -> 9/10 ist eigene Iteration mit
    #   TargetFramework-Sprung.
    # Patch- und Minor-Updates kommen weiter durch.
    ignore:
      - dependency-name: "Markdig"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.Design"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
